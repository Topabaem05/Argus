# Example run configuration for a community service kiosk feedback simulation.
# Uses fixture personas and deterministic dry-run execution.
# No secrets in this file.

runtime:
  run_id: community_kiosk_feedback_001
  seed: 73
  output_dir: outputs
  dry_run: true
  max_turns: 4
  max_participants: 12
  overwrite: false

dataset:
  mode: fixture
  name: nvidia/Nemotron-Personas-Korea
  split: train
  fixture_path: data/samples/personas_fixture.jsonl

sampling:
  sample_size: 8
  seed: 73
  allow_smaller_sample: false
  filters:
    age_range:
      min: 20
      max: 70
    country: South Korea

scenario:
  id: community_kiosk_feedback_v1
  family: urban_local_life
  title: Community center kiosk feedback
  hypothesis: Clear privacy notices and staff fallback options reduce anxiety about kiosk use.
  language: ko
  participant_count: 8
  max_turns: 4
  interventions:
    - id: baseline_kiosk
      description: A standard self-service kiosk flow with minimal privacy explanation.
    - id: assisted_privacy_kiosk
      description: A kiosk flow with plain-language privacy notice and visible staff assistance option.
  metrics:
    - trust_score
    - confusion_rate
    - accessibility_concern_rate
    - staff_assistance_intent
  safety_notes:
    - This is a synthetic simulation for public-service UX exploration.
    - Personas are synthetic and must not be used to profile real people.
    - Results should be treated as design hypotheses, not population predictions.

llm:
  provider: openai
  model: gpt-4
  temperature: 0.4
  max_tokens: 1024
  timeout: 60
  retry_count: 3

rag:
  enabled: false
  required: false

input:
  chat_text: "A district community center wants feedback on a new self-service kiosk for appointment check-in, certificate requests, and class registration. Compare a basic kiosk flow with a version that shows a clear privacy notice and an easy staff-help button."
  attachments:
    - path: "scenario-assets/kiosk-wireframe.png"
      media_type: "image/png"
      size_bytes: 245760
    - path: "scenario-assets/privacy-notice.md"
      media_type: "text/markdown"
      size_bytes: 4096
  attachment_policy:
    max_attachments: 5
    max_attachment_bytes: 10485760
    allowed_extensions:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .webp
      - .mp4
      - .mov
      - .txt
      - .md
      - .csv
      - .json
      - .pdf

persona_selection:
  enabled: true
  max_personas: 8
  seed: 73

persona_memory:
  enabled: false
  apply_confirmed: false
  output_dir: persona_memory_updates

safety:
  policy_version: "1.0"
  block_unsafe: true
